name: Build Dashboard APK

# Builds the Flycast Dashboard APK (PlayStation-style home screen).
# Run it from the Actions tab with "Run workflow" (it also starts by itself when you save this file).
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'l10n_**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache cmake libcurl4-openssl-dev ninja-build

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: dashboard-ccache-${{ github.sha }}
          restore-keys: dashboard-ccache-

      - name: Disable release lint
        run: |
          sed -i '0,/^android {/s//android {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }\n/' shell/android-studio/flycast/build.gradle.kts
          grep -q 'checkReleaseBuilds' shell/android-studio/flycast/build.gradle.kts

      - name: Use debug signing
        run: sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' shell/android-studio/flycast/build.gradle.kts

      - name: Build
        working-directory: shell/android-studio
        run: |
          set +e
          ./gradlew assembleRelease --parallel --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
          python3 - <<'PYEOF'
          import os, re
          t = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "build.log"), errors="replace").read().splitlines()
          keys = re.compile(r"error:|\be: |FAILED|What went wrong|Execution failed|Caused by|Lint found|MissingTranslation|undefined reference|fatal error|ninja: build stopped|CMake Error")
          picked = [l for l in t if keys.search(l)][:25]
          msg = "\n".join(picked + ["-----"] + t[-25:])[:3500]
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + msg)
          PYEOF
          fi
          exit $code

      - uses: actions/upload-artifact@v6
        with:
          name: flycast-dashboard-apk
          path: shell/android-studio/flycast/build/outputs/apk/release/*.apk
